<div id="chcPriceListMessage"></div><div id="gwsPriceListMessage"></div><div id="priceListAccessNotice"></div>

<script>window.KeySuiteAuth={getClient:()=>null};</script><script src="pricelist.js"></script>
<script>
window.KeySuitePriceList.init({products:[],gwsProducts:[],productMultipliers:{CHC:{USD:5.8,RMB:.65,MYR:1},GWS:{USD:6.3,RMB:.7,MYR:1}}},{role:'owner',display_name:'Ray'});
const input=document.getElementById('chcUsdMultiplier');
input.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:1,pointerType:'mouse',button:0}));
setTimeout(()=>{document.body.setAttribute('data-unlocked',String(!input.readOnly));document.body.setAttribute('data-feedback',document.querySelector('#chcMultiplierLock_USD .multiplier-hold-feedback').textContent);},3250);
