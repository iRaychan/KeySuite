<!doctype html><html><body style="margin:0"><iframe id="hq" src="../../keyhq/index.html?embedded=1" style="border:0;width:100vw;height:100vh"></iframe><script>
// Explicit test fixture, never loaded by the production launcher.
const user='00000000-0000-0000-0000-000000000001',other='00000000-0000-0000-0000-000000000002';
const context={userId:user,companyId:'test-only',name:'Bob Test',email:'bob@example.test',role:'user',people:[{name:'Bob Test',email:'bob@example.test',deskNo:1,kind:'human',accountState:'enabled',presence:'online'},{name:'Ray Test',email:'ray@example.test',deskNo:2,kind:'human',accountState:'enabled',presence:'offline'}],avatarProfiles:{companyId:'test-only',userId:user,rows:[{user_id:user,email:'bob@example.test'},{user_id:other,email:'ray@example.test'}]},quotations:[{id:'test-quote',reference:'TEST QUOTATION',createdByEmail:'ray@example.test',customer:'Fixture',date:'2026-10-24',currency:'MYR',amount:100,status:'sealed'}]};
const state={state:'ready',companyId:'test-only',userId:user,messages:[],presence:[{user_id:user}],sessions:[],unread:0};window.sent=[];
function send(data){hq.contentWindow.postMessage(data,location.origin)}
window.addEventListener('message',e=>{if(e.source!==hq.contentWindow)return;const d=e.data;window.sent.push(d);if(d.type==='KEYHQ_READY'){send({type:'KEYHQ_CONTEXT',context:{...context,social:state}})}if(d.type==='KEYHQ_SOCIAL'){if(d.action==='send')state.messages.push({id:d.nonce,sender_id:user,recipient_id:d.recipient,body:d.body,created_at:new Date().toISOString(),read_at:null});if(d.action==='read')state.messages.forEach(m=>{if(m.recipient_id===user)m.read_at=new Date().toISOString()});send({type:'KEYHQ_SOCIAL_RESULT',requestId:d.requestId,action:d.action,ok:true,recipient:d.recipient,result:d.action==='history'?state.messages:[]});send({type:'KEYHQ_SOCIAL_STATE',data:state})}});
window.receive=()=>{state.messages.push({id:crypto.randomUUID(),sender_id:other,recipient_id:user,body:'Please update the CHC price <img src=x onerror=alert(1)>',created_at:new Date().toISOString(),read_at:null});state.unread=1;send({type:'KEYHQ_SOCIAL_STATE',data:state})};
</script></body></html>
