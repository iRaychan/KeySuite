<!doctype html><meta charset="utf-8"><title>KeySuite manual price review</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;background:#f3f6fa}button,input{padding:12px}pre{white-space:pre-wrap}.quote-item{background:white;padding:20px;margin-top:20px}</style><h1>Manual pricing — local review</h1><p>This fixture uses sample data only. No database connection.</p><button id="add">Add pump with missing price</button><div id="rows"></div><script>
window.KeySuiteApp={canEditQuotation:()=>true,ensureQuotationPricingContext:()=>true,showPage(){},addExternalQuoteItem(item){const row=document.createElement('div');row.className='quote-item';row.dataset.pricingSource=JSON.stringify(item.pricingSource);const desc=document.createElement('pre');desc.textContent=item.description;const price=document.createElement('input');price.className='item-price';price.value=item.unitPrice;price.setAttribute('aria-label','Saved unit price');row.append(desc,price);document.getElementById('rows').append(row);return row}};
window.KeySuitePricing={repriceSource:()=>null,quoteBlockReason:()=> 'No price'};
document.getElementById('add').onclick=()=>KeySuiteManualPrice.offer({model:'CR 5-36',description:'B.G.Reich Vertical Multistage Pump Model: CR 5-36\nMaterial: CR / TuC TiC / Viton\nCapacity: 5 m³/h at 100 m',productFamily:'CR'},'Component price not entered.');
</script><script src="../../manual-price-v50011.js"></script>
