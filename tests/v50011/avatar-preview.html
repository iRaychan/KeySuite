<!doctype html><html><head><meta charset="utf-8"><title>V5.00.11 hybrid animation review</title><style>body{margin:0;background:#dce4ee;font:16px system-ui}header{position:absolute;padding:16px;background:#fff;border-radius:12px;margin:12px}canvas{display:block}button,select{padding:8px;margin:4px}</style><script type="importmap">{"imports":{"three":"../../keyhq/vendor/three.module.min.js"}}</script></head><body><header><strong>Temporary hybrid · local rig review</strong><br><select id="pose"><option>idle</option><option>walk</option><option>sit</option><option>recline</option><option>work</option><option>coffee</option><option>ride</option><option>swim</option></select><button id="front">Front</button><button id="side">Side</button><button id="quarter">¾</button><p id="status">Loading actual 3D model…</p></header><script type="module">
import * as T from 'three';import {loadAvatarAsset,createCharacter,animateCharacter} from '../../keyhq/avatar/rig.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#dce4ee');const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);scene.add(new T.HemisphereLight('#ffffff','#6b7891',3));const sun=new T.DirectionalLight('#fff0e1',4);sun.position.set(-3,5,5);scene.add(sun);const rig=createCharacter(await loadAvatarAsset());scene.add(rig.model);let angle=.5,dist=2.4,drag=null;function view(){camera.position.set(Math.sin(angle)*dist,.66,Math.cos(angle)*dist);camera.lookAt(0,.48,0);}view();front.onclick=()=>{angle=0;view()};side.onclick=()=>{angle=Math.PI/2;view()};quarter.onclick=()=>{angle=.7;view()};renderer.domElement.onpointerdown=e=>drag=e.clientX;renderer.domElement.onpointerup=()=>drag=null;renderer.domElement.onpointermove=e=>{if(drag!==null){angle+=(e.clientX-drag)*.01;drag=e.clientX;view();}};renderer.domElement.onwheel=e=>{e.preventDefault();dist=T.MathUtils.clamp(dist+e.deltaY*.002,.8,5);view()};const clock=new T.Clock();document.getElementById('status').textContent='Drag to rotate · scroll to zoom';renderer.setAnimationLoop(()=>{animateCharacter(rig,pose.value,Math.min(clock.getDelta(),.05));renderer.render(scene,camera)});
</script></body></html>
